name: Auto-Update Submodule
on:
  repository_dispatch:
    types: [content_updated]

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.QUARTZ_UPDATE_TOKEN }} # Must use PAT to trigger the next build
          submodules: true

      - name: Update Submodule Pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull the latest commit from the content repo
          git submodule update --init --recursive --remote content
          git add content
          
          git add content
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Automated content update from notes repo"
            git push origin v4
          else
            echo "No changes detected."
          fi

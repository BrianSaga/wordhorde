name: Auto-Update Submodule

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update-submodule]
  schedule:
    - cron: "0 0 * * *" # Optional: runs daily at midnight UTC
jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quartz
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.QUARTZ_UPDATE_TOKEN }} # Must use PAT to trigger the next build
          submodules: recursive
          fetch-depth: 0

      - name: Update Submodule Pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Pull the latest commit from the content repo
          git submodule update --init --recursive --remote content
          git add content

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Automated content update from notes repo"
            git push origin v5
          else
            echo "No changes detected."
          fi
